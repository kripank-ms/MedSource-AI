<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medical Image Diagnosis</title>
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="static/css/image_diagnosis_style.css">


</style>
</head>


<body>

<header class="main-header">

    <div class="logo">
            <span class="logo-icon">
                <i class="fa-solid fa-heart-pulse"></i>
            </span>

            <span>MedSource <strong>AI</strong></span>
    </div>


    <div class="header-right">

        <button class="back-btn" onclick="window.history.back()">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Home</span>
        </button>

    </div>

</header>

<div class="card">

    <h1>Upload a medical image</h1>

    <p class="hint">
        PNG or JPG — choose an image to preview it below.
    </p>


    <form
        action="/image_diagnosis"
        method="POST"
        enctype="multipart/form-data"
        id="uploadForm"
    >


        <!-- Upload area -->

        <label class="drop" id="dropZone">

            <!-- Upload icon -->

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path d="M12 16V4"/>

                <path d="M12 4l-4 4"/>

                <path d="M12 4l4 4"/>

                <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>

            </svg>


            <div class="drop-label">
                Click to choose an image
            </div>


            <div class="drop-sub">
                or drag and drop it here
            </div>


            <!-- FastAPI UploadFile -->

            <input
                type="file"
                id="imageInput"
                name="imageInput"
                accept="image/png,image/jpeg"
                required
            >

        </label>


        <!-- Image preview -->

        <div class="preview" id="preview">

            <img
                id="previewImg"
                src=""
                alt="Selected image preview"
            >

            <div
                class="filename"
                id="fileName"
            ></div>

        </div>


        <!-- Submit -->

        <button
            type="submit"
            class="submit-btn"
            id="submitBtn"
            disabled
        >
            Upload photo
        </button>

    </form>

</div>


<!-- ==================================================
     MEDICAL AI LOADING SCREEN
================================================== -->

<div id="loadingOverlay">

    <div class="scanner-card">


        <!-- Medical icon -->

        <div class="medical-icon">

            <div class="pulse-line"></div>

            <span>+</span>

        </div>


        <h2>
            Medical AI Analysis
        </h2>


        <p class="main-loading-text">
            Analyzing your image...
        </p>


        <!-- Progress -->

        <div class="progress-container">

            <div class="progress-bar"></div>

        </div>


        <!-- Analysis steps -->

        <div class="steps">


            <div class="step active" id="step1">

                <span class="step-icon">
                    ✓
                </span>

                <span>
                    Uploading image
                </span>

            </div>


            <div class="step" id="step2">

                <span class="step-icon">
                    ○
                </span>

                <span>
                    Checking image type
                </span>

            </div>


            <div class="step" id="step3">

                <span class="step-icon">
                    ○
                </span>

                <span>
                    Analyzing medical image
                </span>

            </div>


            <div class="step" id="step4">

                <span class="step-icon">
                    ○
                </span>

                <span>
                    Preparing result
                </span>

            </div>

        </div>


        <p class="warning-text">
            Please don't close or refresh this page.
        </p>

    </div>

</div>


<script>

const input =
    document.getElementById("imageInput");

const dropZone =
    document.getElementById("dropZone");

const preview =
    document.getElementById("preview");

const previewImg =
    document.getElementById("previewImg");

const fileName =
    document.getElementById("fileName");

const submitBtn =
    document.getElementById("submitBtn");

const medicalForm =
    document.getElementById("uploadForm");


/* =========================
   SUBMIT
========================= */

medicalForm.addEventListener("submit", function () {

    document
        .getElementById("loadingOverlay")
        .style.display = "flex";


    /* Step 1 */

    setTimeout(function () {

        document
            .getElementById("step1")
            .classList.add("completed");

        document
            .getElementById("step2")
            .classList.add("active");

    }, 700);


    /* Step 2 */

    setTimeout(function () {

        document
            .getElementById("step2")
            .classList.remove("active");

        document
            .getElementById("step2")
            .classList.add("completed");

        document
            .getElementById("step3")
            .classList.add("active");

    }, 1800);


    /* Step 3 */

    setTimeout(function () {

        document
            .getElementById("step3")
            .classList.remove("active");

        document
            .getElementById("step3")
            .classList.add("completed");

        document
            .getElementById("step4")
            .classList.add("active");

    }, 3500);

});


/* =========================
   PREVIEW
========================= */

function showPreview(file) {

    if (!file) {
        return;
    }


    if (!file.type.startsWith("image/")) {

        alert("Please select an image file.");

        return;
    }


    const reader =
        new FileReader();


    reader.onload = function(event) {

        previewImg.src =
            event.target.result;

        fileName.textContent =
            file.name;

        preview.classList.add("show");

        submitBtn.disabled = false;

    };


    reader.readAsDataURL(file);
}


/* =========================
   FILE SELECTION
========================= */

input.addEventListener("change", function() {

    const file =
        input.files[0];

    if (file) {

        showPreview(file);

    }

});


/* =========================
   DRAG OVER
========================= */

["dragenter", "dragover"]
.forEach(function(eventName) {

    dropZone.addEventListener(
        eventName,
        function(event) {

            event.preventDefault();

            dropZone.classList.add(
                "dragover"
            );

        }
    );

});


/* =========================
   DRAG LEAVE / DROP
========================= */

["dragleave", "drop"]
.forEach(function(eventName) {

    dropZone.addEventListener(
        eventName,
        function(event) {

            event.preventDefault();

            dropZone.classList.remove(
                "dragover"
            );

        }
    );

});


/* =========================
   DROP IMAGE
========================= */

dropZone.addEventListener(
    "drop",
    function(event) {

        const files =
            event.dataTransfer.files;

        if (files.length > 0) {

            input.files =
                files;

            showPreview(
                files[0]
            );

        }

    }
);

</script>

</body>
</html>
